services:
  # Локальный override: порт 5432 на хосте уже занят системными службами
  # PostgreSQL (Windows), не связанными с ivolga — меняем только host-порт,
  # внутри Docker-сети postgres по-прежнему слушает 5432 и другие сервисы
  # обращаются к нему как раньше (DATABASE_URL использует имя сервиса
  # "postgres", не хостовый порт).
  postgres:
    ports:
      - "5433:5432"
  # Порт 8080 на хосте уже занят несвязанным проектом (recalc-frontend) —
  # !override полностью заменяет список ports из docker-compose.frontend.yml
  # (обычный merge конкатенирует списки, из-за чего билд пытался бы занять
  # оба порта разом), контейнер по-прежнему слушает 80 внутри сети.
  frontend:
    ports: !override
      - "8081:80"
