# Дефолт RabbitMQ — 30 минут: если consumer не подтвердил доставку
# сообщения (ack) дольше этого времени, брокер закрывает канал по
# PRECONDITION_FAILED. extract_file с task_acks_late=True на документе с
# большим числом страниц может легитимно работать 30-40 минут — дефолт
# оказывался меньше её собственного HTTP-таймаута (EXTRACTION_TIMEOUT_SECONDS,
# сейчас 2400s/40 мин), так что брокер рвал канал раньше, чем задача успевала
# завершиться сама с контролируемой ошибкой. Canal-разрыв заставлял Celery
# доставить сообщение повторно — та же задача выполнялась дважды параллельно,
# удваивая нагрузку на и без того перегруженный внешний сервис извлечения.
#
# Ставим заметно выше EXTRACTION_TIMEOUT_SECONDS: задача должна успевать
# упасть сама (autoretry_for), а не быть прервана брокером.
consumer_timeout = 3600000
